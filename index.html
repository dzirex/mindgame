<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prší online</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Prší online</h1><p class="sub">Otevřená varianta pro 2–5 hráčů</p><section id="setup" class="panel"><h2>Připojení</h2><label>Přezdívka<input id="name" maxlength="18" autocomplete="nickname" placeholder="např. Jana"></label><div class="buttons"><button id="create">Vytvořit místnost</button><button id="join">Připojit se</button></div><p id="info" aria-live="polite"></p></section><section id="game" hidden><div class="panel bar"><div><b id="roomTitle"></b><br><span id="status"></span></div><button id="copy">Kopírovat odkaz</button></div><section id="lobby" class="panel"><h2>Čekárna</h2><p>Host spustí hru, až se připojí 2–5 hráčů.</p><div id="members"></div><button id="start">Spustit hru</button></section><section id="board" hidden><div id="otherPlayers"></div><div class="panel table"><div><button id="draw" class="card back">LÍZAT<br><b id="deckCount"></b></button><small>Vrchní lízací karta: <b id="deckTop"></b></small></div><div><div id="discard" class="card"></div><small>Odložená karta</small></div></div><section class="panel"><div class="bar"><h2>Ty</h2><span id="myCount"></span></div><div id="myCards" class="cards"></div><div class="buttons"><button id="pass">Ukončit tah</button></div></section><section class="panel"><b>Průběh hry</b><div id="log"></div></section></section></section></main><div id="modal" hidden></div><script type="module" src="app.js"></script></body></html>
